[package]
name = "exceldiff"
version = "0.13.0"
edition = "2021"
description = "A lightweight, high-performance .xlsx (OOXML) parser library"
repository = "https://github.com/MinamiyamaKotaro/exceldiff"
license = "AGPL-3.0-only"
# The tests/fixtures/*/*.xlsx binaries (~1.5MiB of the ~2.3MiB unpacked
# package) exist only for `cargo test` inside a git checkout of this repo
# and are irrelevant to a published crate's consumers — excluded to keep
# a "lightweight" library's own published package lightweight.
exclude = ["tests/fixtures/**/*.xlsx"]

[dependencies]
quick-xml = "0.41.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
thiserror = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
# Optional, behind `diff-storage`: pulled in only by `diff::storage`
# (Issue #3). Left out of the default feature set so a consumer that only
# ever calls `parse_workbook` — the common case for a "lightweight" parser
# — never pays rusqlite's (bundled-SQLite) compile-time cost.
rusqlite = { version = "0.33.0", features = ["bundled"], optional = true }

[features]
diff-storage = ["dep:rusqlite"]
