# A workspace whose root is also a package (`exceldiff` itself): `cli/` is
# a separate, unpublished consumer crate (the `.xlsx` diff CLI, Issue #32),
# kept out of `exceldiff`'s own published binary surface entirely — unlike
# `examples/` (excluded from `cargo install`/plain `cargo build` only by
# Cargo convention) or `src/bin/` (would be auto-included, Issue #23), a
# separate workspace member is never built or packaged by `cargo
# build`/`cargo package` run against the `exceldiff` package alone.
[workspace]
members = ["cli"]
# Not required for a warning-free build — this workspace's root manifest
# also defines a real `[package]` (`exceldiff`, edition 2021), and Cargo
# infers the workspace resolver from a root package's edition when one
# exists (verified: a from-scratch `cargo clean && rm Cargo.lock &&
# cargo build --workspace` emits no resolver warning either way). Only a
# *virtual* workspace manifest (`[workspace]` with no `[package]`) needs
# this set explicitly to avoid defaulting to resolver "1". Set anyway so
# the resolver version is explicit rather than relying on a reader
# knowing that inference rule.
resolver = "2"

[package]
name = "exceldiff"
version = "0.13.0"
edition = "2021"
description = "A lightweight, high-performance .xlsx (OOXML) parser library"
repository = "https://github.com/MinamiyamaKotaro/exceldiff"
license = "AGPL-3.0-only"
# The tests/fixtures/*/*.xlsx binaries (~1.5MiB of the ~2.3MiB unpacked
# package) exist only for `cargo test` inside a git checkout of this repo
# and are irrelevant to a published crate's consumers — excluded to keep
# a "lightweight" library's own published package lightweight.
exclude = ["tests/fixtures/**/*.xlsx"]

[dependencies]
quick-xml = "0.41.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
thiserror = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
# Optional, behind `diff-storage`: pulled in only by `diff::storage`
# (Issue #3). Left out of the default feature set so a consumer that only
# ever calls `parse_workbook` — the common case for a "lightweight" parser
# — never pays rusqlite's (bundled-SQLite) compile-time cost.
rusqlite = { version = "0.33.0", features = ["bundled"], optional = true }

[features]
diff-storage = ["dep:rusqlite"]
