name: .xlsx diff preview

# Posts (and keeps updated) a single PR comment summarizing what changed in
# any .xlsx file the PR touches — built on top of `diff_workbooks` from the
# `diff` module (Issue #3). Scoped to this repo's own tracked .xlsx fixture
# files for now (tests/fixtures/**); see docs/design/diff/engine.md for the
# diff algorithm's own tradeoffs (coordinate-based, not row/column-shift
# aware).
#
# The actual work is delegated to this repo's own composite action
# (`action.yml` at the repo root, `uses: ./` below) — see
# docs/design/action.md for that action's design. This workflow itself now
# only supplies the two things a composite action cannot do for itself:
# the `permissions:` grant and the checkout the action's diff step reads
# from (see action.yml's own "Preconditions" comment).

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - "**/*.xlsx"

concurrency:
  group: xlsx-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff-comment:
    name: Post .xlsx diff comment
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so both the PR's base and head commits are present
      # locally — the composite action's diff step runs `git show
      # <sha>:<path>` for both, and a shallow checkout would only have the
      # (merge) commit currently checked out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./
        id: xlsx_diff
        with:
          comment: 'false'
          job-summary: 'true'
          max-rows-per-sheet: '1'
          diff-mode: 'coordinate'

      # TEMPORARY validation step for PR #38 (Issue #24 inputs/outputs) —
      # confirms the new outputs actually reach a later step. Removed once
      # this live run is confirmed.
      - name: Print action outputs (temporary, PR #38 validation)
        run: |
          echo "has-changes=${{ steps.xlsx_diff.outputs.has-changes }}"
          echo "changed-files-count=${{ steps.xlsx_diff.outputs.changed-files-count }}"
          echo "--- rendered diff body (job-summary source), to confirm max-rows-per-sheet/diff-mode ---"
          cat "${{ runner.temp }}/xlsx-diff-comment.md"
