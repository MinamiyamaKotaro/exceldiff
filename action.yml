name: '.xlsx diff preview'
description: >-
  Builds and posts (or updates) a single pull-request comment summarizing
  what changed in every .xlsx file the PR touches.
author: 'MinamiyamaKotaro'

# Feather v4.28.0 icon set (GitHub Marketplace branding requirement) —
# `grid` mirrors this action's own `visual: true` mode, which renders an
# actual Excel-like grid view of each changed sheet (grid.rs).
# `color: green` per explicit product decision (Issue #27).
branding:
  icon: 'grid'
  color: 'green'

# Preconditions this composite action assumes the caller's own workflow
# already set up (it cannot set these itself — see docs/design/action.md
# "呼び出し元に要求する前提" for why):
#   - `actions/checkout@v4` with `fetch-depth: 0` (this action's diff step
#     needs both the PR's base and head commits present locally to run
#     `git show <sha>:<path>`; a shallow checkout only has the merge
#     commit).
#   - `permissions: contents: read` — always required, independent of
#     `comment`/`visual` below: it's what lets `actions/checkout@v4`
#     above fetch the repository at all. Declaring any `permissions:`
#     block at all switches every unlisted scope from the repo's default
#     to `none` (documented GitHub Actions behavior), so a caller who
#     writes only `permissions: pull-requests: write` silently loses
#     `contents` access — `actions/checkout` then fails with a generic
#     "repository not found" (confirmed by an actual external `uses:`
#     test against a private repo, Issue #23) rather than a permissions
#     error, which makes the real cause easy to miss.
#   - `permissions: pull-requests: write` (composite actions cannot
#     declare their own `permissions:` block — that's workflow/job-level
#     only; only needed when `comment: true`, the default).
#   - `visual: true` needs no extra `permissions:` beyond the plain
#     `contents: read` above: the rendered grid HTML pages are uploaded
#     as a workflow artifact (`actions/upload-artifact@v4`), not
#     committed anywhere, and artifact upload authorizes via the runner's
#     own `ACTIONS_RUNTIME_TOKEN` rather than the `GITHUB_TOKEN`
#     permissions model. See docs/design/grid.md for why a downloadable
#     page is needed at all (GitHub sanitizes `style=` out of PR comment
#     HTML, so the grid itself can't be pasted into the comment directly)
#     and Issue #47 for why the artifact route replaced an earlier
#     commit-to-orphan-branch-plus-raw.githubusercontent.com-link design:
#     that scheme left the grid unviewable on private repos (raw content
#     on a private repo needs per-viewer auth the browser doesn't
#     automatically carry across domains), and a since-abandoned
#     data-URI/`uploads.github.com`-attachment alternative either got
#     stripped by GitHub's comment sanitizer or turned out to be
#     obscurity- rather than permission-gated. A downloadable artifact is
#     slower to view (no inline preview) but is gated by the same
#     repository-read permission as everything else here — the only
#     option confirmed to actually enforce "only people with repo access
#     can see this." The artifact ships the standalone HTML page itself
#     (not a rasterized screenshot, dropped after the same Issue #47
#     round of user feedback) — a large sheet renders as a huge PNG that
#     shrinks to illegible in most viewers, where the HTML page just
#     scrolls/zooms like any other page. This also means visual mode no
#     longer needs Node.js/Playwright/Chromium at all.
#   - trigger `on: pull_request` (this action does nothing useful outside
#     a pull_request event: the diff step reads
#     `github.event.pull_request.base.sha`/`head.sha`).

inputs:
  github-token:
    description: >-
      GITHUB_TOKEN or a PAT used to find/create/update the PR comment.
      Defaults to the calling workflow's own GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
  files:
    description: >-
      Git pathspec selecting which changed files to diff (passed straight
      to `git diff -- <files>`, so it's pathspec syntax, not a shell glob
      — e.g. the default already matches at any depth without a leading
      `**/`).
    required: false
    default: '*.xlsx'
  comment:
    description: 'Post/update a PR comment with the diff.'
    required: false
    default: 'true'
  job-summary:
    description: >-
      Also write the diff to the job's `$GITHUB_STEP_SUMMARY`. Useful when
      `comment` is turned off (e.g. no `pull-requests: write` permission
      available, such as a fork PR) but the diff should still be visible
      somewhere.
    required: false
    default: 'false'
  max-rows-per-sheet:
    description: >-
      Caps the number of cell-change hunks rendered per sheet
      (`MarkdownOptions::max_rows_per_sheet`).
    required: false
    default: '30'
  diff-mode:
    description: >-
      `auto` (default) picks whichever of coordinate/row-aligned/
      column-aligned diffing reports the fewest changes per sheet.
      `coordinate` forces plain coordinate-based diffing, skipping
      alignment detection — see docs/design/action.md for the tradeoff.
    required: false
    default: 'auto'
  diff-scope:
    description: >-
      `pr` (default) diffs the PR's cumulative `base.sha`..`head.sha` as
      one Markdown section per changed file, same as always. `commit`
      instead walks every commit the PR introduces (in order) and renders
      one subsection per commit, diffing each commit against its
      immediate parent — so a file added in one commit and then modified
      in a later commit of the same PR shows both instead of only a
      final "Added" (Issue #23, Issue #43). `visual: true`'s grid HTML
      artifact is namespaced by commit in this mode too, so each
      commit's rendering stays separately downloadable rather than the
      later commit's grid silently overwriting the earlier one's.
    required: false
    default: 'pr'
  visual:
    description: >-
      Also render an Excel-like Before/After grid view for each changed
      sheet (via `grid.rs`'s `render_sheet_split`), combined into one
      standalone HTML page per changed file, and attach them to the
      comment as a downloadable workflow artifact (see "Preconditions"
      above for why it's a download link
      rather than something embedded inline).
    required: false
    default: 'false'

outputs:
  has-changes:
    description: 'Whether any file matching `files` changed in the PR.'
    value: ${{ steps.diff.outputs.has-changes }}
  changed-files-count:
    description: 'Number of files matching `files` that changed in the PR.'
    value: ${{ steps.diff.outputs.changed-files-count }}

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    # `workspaces` must point at this action's own checkout
    # (`github.action_path`), not the default `.` (the caller's
    # checkout) — see docs/design/action.md point 2.
    - name: Cache cargo build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "${{ github.action_path }} -> target"

    # `--manifest-path` makes Cargo resolve its target dir relative to
    # this action's own workspace root (`github.action_path`), not the
    # caller's `$PWD` — see docs/design/action.md point 1. The build
    # step below reads the binary back out of that same location.
    - name: Build xlsx diff CLI
      shell: bash
      run: |
        cargo build --release -p xlsxdiff \
          --manifest-path "${{ github.action_path }}/Cargo.toml"

    - name: Compute diffs for changed files
      id: diff
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BIN: ${{ github.action_path }}/target/release/xlsxdiff
        OUT: ${{ runner.temp }}/xlsx-diff-comment.md
        FILES: ${{ inputs.files }}
        MAX_ROWS_PER_SHEET: ${{ inputs.max-rows-per-sheet }}
        DIFF_MODE: ${{ inputs.diff-mode }}
        DIFF_SCOPE: ${{ inputs.diff-scope }}
        VISUAL: ${{ inputs.visual }}
        VISUALS_DIR: ${{ runner.temp }}/xlsx-diff-visuals
        VISUALS_LIST: ${{ runner.temp }}/xlsx-diff-visuals-list.tsv
      run: |
        set -euo pipefail

        # Fails fast on a typo'd diff-scope rather than silently falling
        # back to "pr" behavior later — the branch below only ever checks
        # for "commit", so any other unexpected value would otherwise run
        # to completion having quietly ignored what was actually asked for.
        case "$DIFF_SCOPE" in
          pr|commit) ;;
          *)
            echo "::error::diff-scope must be 'pr' or 'commit', got '${DIFF_SCOPE}'" >&2
            exit 1
            ;;
        esac

        {
          echo "<!-- xlsx-diff-comment -->"
          echo "## 📊 .xlsx diff preview"
          echo
        } > "$OUT"

        # Keeps a path/branch component filesystem- and URL-safe —
        # non-alphanumeric runs collapse to a single "_" so a nested file
        # path or a sheet name with spaces/slashes can't escape the
        # directory it's placed under or produce an ambiguous raw URL.
        # `printf` (not `echo`) so there's no trailing "\n" for `tr -c`
        # (which maps every byte *not* in the allowed set, newline
        # included) to turn into a stray trailing "_".
        sanitize() {
          printf '%s' "$1" | tr -c '[:alnum:]._-' '_'
        }

        # Diffs one (status, path) pair between $3/$4 revisions and
        # appends its Markdown section to $OUT, exactly like the old
        # inline loop body did. $5 is a commit label (short SHA, or ""
        # in `diff-scope: pr` mode) — threaded into both the grid HTML's
        # destination path and $VISUALS_LIST's new leading column so a
        # file touched by more than one commit gets one grid page *per
        # commit* instead of the later commit's page silently
        # overwriting the earlier one's at the same path (Issue #43).
        process_one_file() {
          local file_status="$1" path="$2" base_sha="$3" head_sha="$4" commit_label="$5"
          [ -z "$path" ] && return 0

          local base_file="" head_file=""
          case "$file_status" in
            A)
              head_file=$(mktemp)
              git show "$head_sha:$path" > "$head_file"
              ;;
            D)
              base_file=$(mktemp)
              git show "$base_sha:$path" > "$base_file"
              ;;
            M)
              base_file=$(mktemp)
              head_file=$(mktemp)
              git show "$base_sha:$path" > "$base_file"
              git show "$head_sha:$path" > "$head_file"
              ;;
            *)
              return 0
              ;;
          esac

          local bin_args=(--max-rows-per-sheet "$MAX_ROWS_PER_SHEET" --diff-mode "$DIFF_MODE")
          local grid_dir=""
          if [ "$VISUAL" = "true" ]; then
            grid_dir=$(mktemp -d)
            bin_args+=(--grid-html-dir "$grid_dir")
          fi

          "$BIN" "${bin_args[@]}" "$path" "$file_status" "$base_file" "$head_file" >> "$OUT"

          # xlsxdiff --grid-html-dir writes every changed sheet's
          # fragment into one combined, self-contained page
          # (grid.html — inline <style>, no external assets, see
          # grid.rs's wrap_grid_page) plus manifest.tsv listing each
          # sheet's name against that same path. Collected under
          # $VISUALS_DIR rather than embedded inline — see the
          # "Preconditions" comment at the top of this file for why —
          # and shipped in one batch as a single workflow artifact once
          # every changed file has been processed (below). A copy
          # failure is reported to stderr and skipped — never fatal to
          # the rest of the comment, the same "one file's problem
          # doesn't stop the others" policy the text diff above already
          # follows for a parse error. `commit_label` (empty in `pr`
          # mode) namespaces the destination under its own subdirectory
          # so per-commit pages for the same path never collide.
          if [ "$VISUAL" = "true" ] && [ -s "$grid_dir/manifest.tsv" ]; then
            local html_path dest_rel dest_abs sheet_names
            html_path=$(cut -f2 "$grid_dir/manifest.tsv" | head -n1)
            if [ -n "$commit_label" ]; then
              dest_rel="${commit_label}/$(sanitize "$path").html"
            else
              dest_rel="$(sanitize "$path").html"
            fi
            dest_abs="$VISUALS_DIR/$dest_rel"
            mkdir -p "$(dirname "$dest_abs")"
            if cp "$html_path" "$dest_abs"; then
              sheet_names=$(cut -f1 "$grid_dir/manifest.tsv" | paste -sd, -)
              # "-" (never a real short SHA) rather than "" for a
              # commit-less (`pr` mode) row: tab counts as IFS
              # *whitespace* to `read`, which silently strips/collapses
              # empty fields at a line's edges — an empty leading column
              # here would shift every field left by one downstream.
              printf '%s\t%s\t%s\n' "${commit_label:--}" "$path" "$sheet_names" >> "$VISUALS_LIST"
            else
              echo "warning: failed to collect grid HTML for $path" >&2
            fi
          fi
          [ -n "$grid_dir" ] && rm -rf "$grid_dir"

          [ -n "$base_file" ] && rm -f "$base_file"
          [ -n "$head_file" ] && rm -f "$head_file"
        }

        # --no-renames: a rename shows up as a plain Delete + Add pair
        # instead of an "R###" status line, which keeps the status
        # parsing below to exactly A/M/D. Computed unconditionally
        # (regardless of $DIFF_SCOPE) since has-changes/changed-files-count
        # always reflect the PR's cumulative diff — `diff-scope: commit`
        # only changes how the comment *body* is broken into sections, not
        # what these two outputs report, so callers reading them see no
        # behavior change either way.
        changed=$(git diff --no-renames --name-status "$BASE_SHA" "$HEAD_SHA" -- "$FILES" || true)

        if [ -z "$changed" ]; then
          echo "has-changes=false" >> "$GITHUB_OUTPUT"
          echo "changed-files-count=0" >> "$GITHUB_OUTPUT"
          echo "_No changes detected._" >> "$OUT"
        else
          echo "has-changes=true" >> "$GITHUB_OUTPUT"
          echo "changed-files-count=$(wc -l <<< "$changed" | tr -d ' ')" >> "$GITHUB_OUTPUT"

          if [ "$DIFF_SCOPE" = "commit" ]; then
            # One subsection per PR commit, each diffed against its own
            # immediate (first) parent — a merge commit inside the PR's
            # range is walked the same way `git show <sha>`/GitHub's own
            # PR "Commits" tab treats it (first-parent diff), so a merge
            # that carries no .xlsx change of its own naturally produces
            # an empty/skipped subsection (verified in the Issue #43 PoC).
            commits=$(git log --reverse --format=%H "$BASE_SHA..$HEAD_SHA")
            while IFS= read -r sha; do
              [ -z "$sha" ] && continue
              # A root commit (no parent) has no "^1" — `git rev-parse`
              # would fail there and, under `set -e`, abort this whole
              # step. Falling back to git's well-known empty-tree object
              # matches how `git show`/`git diff` themselves treat a root
              # commit, so it diffs cleanly against "nothing" instead.
              if ! parent=$(git rev-parse "${sha}^1" 2>/dev/null); then
                parent="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
              fi
              commit_changed=$(git diff --no-renames --name-status "$parent" "$sha" -- "$FILES" || true)
              [ -z "$commit_changed" ] && continue

              # Escaped so a subject containing a lone/unmatched backtick
              # can't leave an unterminated Markdown code span open,
              # which would otherwise swallow (and corrupt the rendering
              # of) everything in the comment written after it.
              subject=$(git log -1 --format=%s "$sha" | sed 's/`/\\`/g')
              short="${sha:0:7}"
              {
                echo
                echo "## Commit \`${short}\` — ${subject}"
                echo
              } >> "$OUT"

              while IFS=$'\t' read -r file_status path; do
                process_one_file "$file_status" "$path" "$parent" "$sha" "$short"
              done <<< "$commit_changed"
            done <<< "$commits"
          else
            while IFS=$'\t' read -r file_status path; do
              process_one_file "$file_status" "$path" "$BASE_SHA" "$HEAD_SHA" ""
            done <<< "$changed"
          fi
        fi

        # `read` returns non-zero once the herestring above is exhausted —
        # normal, expected loop termination, not a real failure. But since
        # that `while` is the last command this script runs, its exit
        # status (1) would otherwise become *this whole step's* exit
        # status under `set -e`, intermittently failing a step that
        # actually completed successfully (observed happening for a
        # single-changed-file diff, where there's only one iteration
        # before the terminating EOF read). An explicit always-succeeding
        # command as the true last statement prevents that.
        :

        if [ -s "$VISUALS_LIST" ]; then
          echo "has-visuals=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-visuals=false" >> "$GITHUB_OUTPUT"
        fi

    # Uploaded as one artifact covering every sheet from this run (all
    # changed files/sheets), not one artifact per page — see the
    # "Preconditions" comment at the top of this file for why this
    # replaced an inline raw.githubusercontent.com image link.
    - name: Upload grid views
      if: ${{ inputs.visual == 'true' && steps.diff.outputs.has-visuals == 'true' }}
      id: upload_visuals
      uses: actions/upload-artifact@v4
      with:
        name: xlsx-diff-grids
        path: ${{ runner.temp }}/xlsx-diff-visuals

    # Runs after the upload above specifically because `artifact-url` is
    # only known once the artifact actually exists — the comment body
    # ($OUT) was already written by the diff step, so this appends to it
    # rather than folding the link into that step's own output.
    - name: Append grid artifact link to comment
      if: ${{ inputs.visual == 'true' && steps.diff.outputs.has-visuals == 'true' }}
      shell: bash
      env:
        OUT: ${{ runner.temp }}/xlsx-diff-comment.md
        VISUALS_LIST: ${{ runner.temp }}/xlsx-diff-visuals-list.tsv
        ARTIFACT_URL: ${{ steps.upload_visuals.outputs.artifact-url }}
      run: |
        set -euo pipefail
        {
          echo
          echo "### 🖼 Grid diff views"
          echo
          echo "Excel-like grid views (HTML, one page per changed file — download and open in a browser) are attached as a workflow artifact (downloading requires read access to this repository): ${ARTIFACT_URL}"
          echo
          # $VISUALS_LIST's leading column is a commit label (short SHA)
          # in `diff-scope: commit` mode, "-" otherwise (see the diff
          # step's own comment on why not simply ""). A real label gets
          # grouped under its own subheading (matching the per-commit
          # sections above them in the comment body); "-" (plain
          # `diff-scope: pr` mode) falls through to the original flat
          # list, unchanged.
          last_commit=""
          while IFS=$'\t' read -r commit_label path sheet_names; do
            if [ "$commit_label" != "-" ] && [ "$commit_label" != "$last_commit" ]; then
              [ -n "$last_commit" ] && echo
              echo "**Commit \`${commit_label}\`**"
              echo
              last_commit="$commit_label"
            fi
            echo "- ${path} — ${sheet_names}"
          done < "$VISUALS_LIST"
        } >> "$OUT"

    - name: Write job summary
      if: ${{ inputs.job-summary == 'true' }}
      shell: bash
      env:
        OUT: ${{ runner.temp }}/xlsx-diff-comment.md
      run: cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

    # A comment marker (<!-- xlsx-diff-comment -->, written above) lets
    # this find-then-update pair edit the same comment across pushes to
    # the PR instead of piling up a new one each time.
    - if: ${{ inputs.comment == 'true' }}
      uses: peter-evans/find-comment@v3
      id: find_comment
      with:
        token: ${{ inputs.github-token }}
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: "github-actions[bot]"
        body-includes: "<!-- xlsx-diff-comment -->"

    # NOTE: for a PR opened from a fork, GitHub Actions forces the
    # GITHUB_TOKEN to read-only regardless of the caller's `permissions:`
    # block — this step then fails to post, harmlessly (nothing else in
    # this job depends on it). Same-repo-branch PRs are unaffected. A
    # fork PR should instead set `comment: false` / `job-summary: true`.
    - if: ${{ inputs.comment == 'true' }}
      uses: peter-evans/create-or-update-comment@v4
      with:
        token: ${{ inputs.github-token }}
        comment-id: ${{ steps.find_comment.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        body-path: ${{ runner.temp }}/xlsx-diff-comment.md
        edit-mode: replace
